<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영수증이 너무 솔직해 🧾 | ONE DAY LAB</title><style>*{box-sizing:border-box}body{margin:0;background:#f9f1d9;color:#232821;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh}main{width:min(94vw,430px);background:#fffdf4;border:3px solid #242920;border-radius:25px;box-shadow:8px 9px 0 #232821;padding:24px;text-align:center}h1{font-size:32px;margin:8px 0}p{line-height:1.5}button,a.btn{cursor:pointer;background:#f7c950;border:2px solid #232821;border-radius:13px;padding:12px 18px;margin:7px;font-weight:900;color:#232821;text-decoration:none;font-size:16px;box-shadow:3px 3px 0 #232821}button:active{transform:translate(2px,2px);box-shadow:none}.scene{background:#c8e8d8;border:2px solid #232821;border-radius:18px;min-height:235px;padding:20px;position:relative;overflow:hidden;margin:18px 0}.big{font-size:75px;margin:18px}.sub{font-size:12px;letter-spacing:2px;font-weight:900;color:#bb6957}.result{font-weight:900;font-size:20px;min-height:26px}a.back{font-size:13px;color:#666}</style></head><body><main><div class="sub">ONE DAY LAB · GAME</div><h1>영수증이 너무 솔직해 🧾</h1><p>영수증을 적당히 뽑아야 한다. 너무 많이 뽑으면...?</p><div class="scene"><div style="background:white;border:2px dashed #777;margin:auto;width:185px;min-height:95px;padding:15px" id="paper">RECEIPT<br>──────<br>오늘의 나</div><p id="count">출력 0cm</p><button id="print">🧾 영수증 뽑기</button><button id="done">멈추기 ✋</button></div><div class="result" id="result"></div><button onclick="location.reload()">다시 하기 ↻</button><p><a class="back" href="index.html">← 게임 목록</a></p></main><script>let cm=0;const secrets=['오늘 커피값: 기분값 포함','회사 메신저 읽음: 마음은 안 읽음','월급: 스쳐 지나감','주말: 눈 깜빡하니 월요일','저축: 다음 달의 나에게 부탁'];document.getElementById('print').onclick=()=>{cm+=20;document.getElementById('count').textContent='출력 '+cm+'cm';document.getElementById('paper').innerHTML+=' <hr>'+secrets[Math.min(secrets.length-1,Math.floor(cm/40))];if(cm>=120)document.getElementById('result').textContent='너무 솔직해서 출력 중단 위기 😵'};document.getElementById('done').onclick=()=>{document.getElementById('result').textContent=cm>=40&&cm<=80?'적당한 솔직함! 성공 🎊':cm<40?'너무 소심하게 뽑았어 🥹':'영수증에 인생이 출력됐어 💀';document.getElementById('print').disabled=true};</script></body></html>
