<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한입만이라며? 🍕 | ONE DAY LAB</title><style>*{box-sizing:border-box}body{margin:0;background:#f9f1d9;color:#232821;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh}main{width:min(94vw,430px);background:#fffdf4;border:3px solid #242920;border-radius:25px;box-shadow:8px 9px 0 #232821;padding:24px;text-align:center}h1{font-size:32px;margin:8px 0}p{line-height:1.5}button,a.btn{cursor:pointer;background:#f7c950;border:2px solid #232821;border-radius:13px;padding:12px 18px;margin:7px;font-weight:900;color:#232821;text-decoration:none;font-size:16px;box-shadow:3px 3px 0 #232821}button:active{transform:translate(2px,2px);box-shadow:none}.scene{background:#c8e8d8;border:2px solid #232821;border-radius:18px;min-height:235px;padding:20px;position:relative;overflow:hidden;margin:18px 0}.big{font-size:75px;margin:18px}.sub{font-size:12px;letter-spacing:2px;font-weight:900;color:#bb6957}.result{font-weight:900;font-size:20px;min-height:26px}a.back{font-size:13px;color:#666}</style></head><body><main><div class="sub">ONE DAY LAB · GAME</div><h1>한입만이라며? 🍕</h1><p>세 입만 먹고 70% 이상 남길 수 있을까?</p><div class="scene"><div class="big" id="food">🍕</div><div id="remain">남은 음식 100%</div><button id="bite">한입 먹기 😋</button><p id="n">0 / 3입</p></div><div class="result" id="result"></div><button onclick="location.reload()">다시 하기 ↻</button><p><a class="back" href="index.html">← 게임 목록</a></p></main><script>let remaining=100,n=0;const bite=document.getElementById('bite');bite.onclick=()=>{if(n>=3)return;n++;const loss=[8,13,18,22,27][Math.floor(Math.random()*5)];remaining=Math.max(0,remaining-loss);document.getElementById('remain').textContent='남은 음식 '+remaining+'%';document.getElementById('n').textContent=n+' / 3입';document.getElementById('food').style.transform='scale('+Math.max(.4,remaining/100)+')';if(n===3){bite.disabled=true;document.getElementById('result').textContent=remaining>=70?'성공! 진짜 한입만 먹는 친구 👏':'실패! 그건 한입이 아니잖아 😭';}}</script></body></html>
