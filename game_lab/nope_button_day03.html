<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>거절 버튼 어디감? 🏃 | ONE DAY LAB</title><style>*{box-sizing:border-box}body{margin:0;background:#f9f1d9;color:#232821;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh}main{width:min(94vw,430px);background:#fffdf4;border:3px solid #242920;border-radius:25px;box-shadow:8px 9px 0 #232821;padding:24px;text-align:center}h1{font-size:32px;margin:8px 0}p{line-height:1.5}button,a.btn{cursor:pointer;background:#f7c950;border:2px solid #232821;border-radius:13px;padding:12px 18px;margin:7px;font-weight:900;color:#232821;text-decoration:none;font-size:16px;box-shadow:3px 3px 0 #232821}button:active{transform:translate(2px,2px);box-shadow:none}.scene{background:#c8e8d8;border:2px solid #232821;border-radius:18px;min-height:235px;padding:20px;position:relative;overflow:hidden;margin:18px 0}.big{font-size:75px;margin:18px}.sub{font-size:12px;letter-spacing:2px;font-weight:900;color:#bb6957}.result{font-weight:900;font-size:20px;min-height:26px}a.back{font-size:13px;color:#666}</style></head><body><main><div class="sub">ONE DAY LAB · GAME</div><h1>거절 버튼 어디감? 🏃</h1><p>도망가는 NO 버튼을 다섯 번 잡아봐!</p><div class="scene"><div style="font-size:30px;font-weight:900">부탁 하나만 들어줄래?</div><button id="yes">YES 😇</button><button id="no" style="position:absolute;left:48%;top:65%">NO 😤</button><p id="score" style="position:absolute;bottom:3px;left:0;right:0">0 / 5</p></div><div class="result" id="result"></div><button onclick="location.reload()">다시 하기 ↻</button><p><a class="back" href="index.html">← 게임 목록</a></p></main><script>let hits=0;const no=document.getElementById('no'),scene=document.querySelector('.scene');function move(){const w=scene.clientWidth-100,h=scene.clientHeight-70;no.style.left=Math.random()*w+'px';no.style.top=(30+Math.random()*(h-30))+'px'};no.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&Math.random()<.65)move()});no.addEventListener('click',()=>{hits++;document.getElementById('score').textContent=hits+' / 5';if(hits>=5){document.getElementById('result').textContent='거절 성공! 단호함 MAX 🎉';no.remove()}else move()});document.getElementById('yes').onclick=()=>document.getElementById('result').textContent='또 승낙해버렸어... 🥲';</script></body></html>
