<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>포장 좀 해주세요! | WRAP IT UP</title><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');*{box-sizing:border-box}body{margin:0;background:#e7e9e1;font-family:'Nunito',system-ui,'Apple SD Gothic Neo',sans-serif;color:#26332a;display:flex;justify-content:center;min-height:100dvh}.app{width:min(100%,450px);min-height:100dvh;background:#f9f3de;position:relative;overflow:hidden;padding:17px 19px 22px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:2px;font-weight:900}.pill{background:#fff;box-shadow:3px 3px 0 #27382c;border:2px solid #27382c;border-radius:25px;padding:7px 12px;font-size:12px;font-weight:900}h1{font-weight:900;font-size:clamp(29px,8vw,40px);letter-spacing:-2px;line-height:1.05;margin:19px 0 6px}.subtitle{font-size:12px;font-weight:800;opacity:.55;margin-bottom:16px}.bubble{background:white;border:2.5px solid #26332a;border-radius:18px;padding:12px 15px;box-shadow:4px 5px 0 #26332a;position:relative;font-size:15px;font-weight:900;min-height:73px}.bubble:after{content:'';position:absolute;bottom:-13px;left:30px;border:7px solid transparent;border-top-color:#26332a}.bubble small{display:block;font-size:11px;color:#e26a5a;margin-bottom:5px}.stage{background:#c6e8d5;border:3px solid #26332a;border-radius:25px;margin:21px 0 12px;flex:1;min-height:280px;position:relative;overflow:hidden;touch-action:none;display:flex;align-items:stretch}.stage:before{content:'';position:absolute;bottom:0;left:0;right:0;height:26%;background:#efc894;border-top:3px solid #26332a}.stage canvas{position:absolute;width:100%;height:100%;touch-action:none}.stamp{position:absolute;right:12px;top:12px;padding:6px 8px;background:#fff7df;border:2px solid #26332a;transform:rotate(8deg);border-radius:6px;font-weight:900;font-size:11px;pointer-events:none}.meter{display:flex;justify-content:space-between;align-items:center;margin:1px 0 8px;font-size:12px;font-weight:900}.meter strong{font-size:18px}.bar{background:#e8dcc6;border:2px solid #26332a;border-radius:100px;height:17px;overflow:hidden}.fill{height:100%;width:0;background:repeating-linear-gradient(45deg,#f28aa9 0 12px,#ffcce1 12px 23px);transition:width .15s}.tools{display:flex;gap:8px;align-items:center;margin:13px 0}.tape{height:48px;flex:1;border-radius:12px;border:2px solid #26332a;cursor:pointer;box-shadow:2px 3px 0 #26332a;position:relative}.tape.selected{outline:3px solid #26332a;outline-offset:2px;transform:translateY(-2px)}.tape:after{content:'✦';display:block;position:absolute;font-size:20px;color:#ffffffbb;left:calc(50% - 7px);top:10px}.pink{background:#f58ca8}.blue{background:#76a8ec}.yellow{background:#f6c650}.black{background:#33413a}.reset{flex:0 0 66px;height:48px;background:#fff;border:2px solid #26332a;border-radius:12px;font-weight:900;cursor:pointer}.action{height:60px;background:#ee765d;color:#242f27;border:3px solid #26332a;box-shadow:4px 5px 0 #26332a;border-radius:18px;font-size:20px;font-weight:900;cursor:pointer;letter-spacing:-.7px}.action:active{transform:translate(3px,3px);box-shadow:1px 2px 0 #26332a}.hint{text-align:center;font-size:11px;opacity:.7;font-weight:800;margin:15px 0 0}.overlay{position:absolute;inset:0;background:rgba(25,36,26,.7);z-index:4;display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{width:100%;background:#fff7e8;border:3px solid #26332a;border-radius:25px;box-shadow:8px 10px 0 #26332a;padding:20px;text-align:center;max-height:95dvh;overflow:auto}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:900;color:#db7766}.verdict{font-size:30px;font-weight:900;letter-spacing:-1.4px;line-height:1.15;margin:10px 0}.modal p{font-size:14px;font-weight:800;line-height:1.6}.thumb{background:#c6e8d5;border:2px solid #26332a;border-radius:15px;margin:13px 0;width:100%;height:165px;object-fit:contain}.modal button{width:100%;padding:14px;border:2px solid #26332a;border-radius:12px;margin-top:8px;font-size:15px;font-weight:900;background:#f6c650;cursor:pointer}.modal button.secondary{background:white}.fine{font-size:10px;opacity:.65;margin:8px 0}.footer{display:flex;justify-content:center;gap:10px;margin-top:13px;font-size:11px;opacity:.6;font-weight:900}@media (max-height:700px){h1{margin:9px 0 3px}.subtitle{margin-bottom:8px}.stage{min-height:210px;margin-top:15px}}
</style></head><body><main class="app"><header class="top"><div class="brand">ODD LITTLE GAMES™</div><div class="pill" id="round">ORDER 01/03</div></header><h1>포장 좀<br>해주세요! 📦</h1><div class="subtitle">WRAP IT UP! · 과잉 포장 전문점</div><div class="bubble"><small id="label">CUSTOMER #01 · 🧸</small><span id="request">곰인형이 다치지 않게 포장해주세요.</span></div><div class="stage" id="stage"><canvas id="cv"></canvas><div class="stamp" id="stamp">FRAGILE? 🤨</div></div><div class="meter"><span>테이프 사용량</span><strong id="amount">0 cm</strong></div><div class="bar"><div class="fill" id="fill"></div></div><div class="tools"><button aria-label="핑크 테이프" class="tape pink selected" data-color="#f58ca8"></button><button aria-label="파랑 테이프" class="tape blue" data-color="#76a8ec"></button><button aria-label="노랑 테이프" class="tape yellow" data-color="#f6c650"></button><button aria-label="검정 테이프" class="tape black" data-color="#33413a"></button><button class="reset" id="undo">되돌림</button></div><button class="action" id="done">포장 완료! ✂️</button><div class="hint">상자 위에 손가락으로 테이프를 드래그하세요</div><div class="footer"><span>NO ADS</span><span>100% NONSENSE</span><span>✦ MADE FOR FUN</span></div><div class="overlay" id="overlay"><section class="modal"><div class="eyebrow" id="outEyebrow">CUSTOMER REVIEW</div><div class="verdict" id="verdict">완벽한 과잉 포장</div><p id="reaction">이것은 포장인가 감금인가?</p><img class="thumb" id="thumb" alt="포장 결과"><p id="stats">테이프 0 cm</p><button id="next">다음 손님 →</button><button id="save" class="secondary">📸 결과 이미지 저장</button><p class="fine">링크로 공유하려면 이 파일을 웹에 배포해야 해요.</p></section></div></main><script>
(()=>{const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');const orders=[{icon:'🧸',title:'곰인형이 다치지 않게 포장해주세요.',name:'곰인형',wish:130},{icon:'🏺',title:'이 도자기, 절대로 깨지면 안 돼요.',name:'도자기',wish:200},{icon:'💨',title:'아무것도 없는 상자예요. 공기만 포장해 주세요.',name:'공기',wish:35}];let round=0,lines=[],current=null,col='#f58ca8',used=0,canvasW=340,canvasH=360,canDraw=true;const $=id=>document.getElementById(id);let box={x:70,y:130,w:205,h:152};function resize(){const r=stage.getBoundingClientRect();canvasW=r.width;canvasH=r.height;cv.width=Math.floor(r.width*devicePixelRatio);cv.height=Math.floor(r.height*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);box={x:canvasW*.2,y:canvasH*.39,w:canvasW*.6,h:canvasH*.41};draw()}function bg(){ctx.fillStyle='#e9d4a7';ctx.fillRect(0,canvasH*.79,canvasW,canvasH*.21);ctx.strokeStyle='#26332a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,canvasH*.79);ctx.lineTo(canvasW,canvasH*.79);ctx.stroke()}function packageShape(){let {x,y,w,h}=box;ctx.save();ctx.shadowColor='#5a655b55';ctx.shadowBlur=16;ctx.shadowOffsetY=9;ctx.fillStyle='#d59e62';ctx.strokeStyle='#26332a';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(x,y,w,h,9);ctx.fill();ctx.stroke();ctx.restore();ctx.fillStyle='#eabe84';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w*.22,y-22);ctx.lineTo(x+w*.98,y-22);ctx.lineTo(x+w,y);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x+w+20,y-18);ctx.lineTo(x+w+20,y+h-20);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#b17d45';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+w*.5,y);ctx.lineTo(x+w*.5,y+h);ctx.stroke();ctx.fillStyle='#fff3d7';ctx.fillRect(x+16,y+18,75,53);ctx.strokeStyle='#26332a';ctx.strokeRect(x+16,y+18,75,53);ctx.fillStyle='#26332a';ctx.font='bold 12px system-ui';ctx.fillText('TO: ???',x+24,y+38);ctx.font='bold 20px system-ui';ctx.fillText(['🧸','🏺','💨'][round],x+24,y+63);ctx.save();ctx.beginPath();ctx.roundRect(x+2,y+2,w-4,h-4,6);ctx.clip();for(const line of lines)drawLine(line);if(current)drawLine(current);ctx.restore()}
function drawLine(l){if(l.points.length<2)return;ctx.strokeStyle=l.color;ctx.lineWidth=17;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(l.points[0].x,l.points[0].y);l.points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();ctx.strokeStyle='#ffffff40';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(l.points[0].x,l.points[0].y-4);l.points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y-4));ctx.stroke()}
function draw(){ctx.clearRect(0,0,canvasW,canvasH);bg();ctx.font='40px system-ui';ctx.fillText('✂️',canvasW*.075,canvasH*.27);ctx.fillText('🧷',canvasW*.76,canvasH*.22);packageShape();if(round===2){ctx.font='900 13px system-ui';ctx.fillStyle='#26332a';ctx.fillText('HANDLE WITH AIR',box.x+10,box.y+box.h-18)}}function position(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function count(){used=lines.reduce((a,l)=>a+pathLen(l.points),0)+(current?pathLen(current.points):0);const n=Math.round(used/12);$('amount').textContent=n+' cm';$('fill').style.width=Math.min(n/350*100,100)+'%';$('stamp').textContent=n>250?'TAPE MUMMY 💀':n>110?'VERY SAFE! 😵':'FRAGILE? 🤨'}function pathLen(p){let n=0;for(let i=1;i<p.length;i++)n+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);return n}cv.addEventListener('pointerdown',e=>{if(!canDraw)return;cv.setPointerCapture(e.pointerId);current={color:col,points:[position(e)]};draw()});cv.addEventListener('pointermove',e=>{if(!current)return;const p=position(e);const last=current.points.at(-1);if(Math.hypot(p.x-last.x,p.y-last.y)>3){current.points.push(p);count();draw()}});function release(){if(current){if(current.points.length>1)lines.push(current);current=null;count();draw()}}cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);document.querySelectorAll('.tape').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tape').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');col=b.dataset.color});$('undo').onclick=()=>{lines.pop();count();draw()};function makeImage(){const out=document.createElement('canvas');out.width=760;out.height=940;let c=out.getContext('2d');c.fillStyle='#fff6e5';c.fillRect(0,0,760,940);c.fillStyle='#26332a';c.textAlign='center';c.font='900 30px system-ui';c.fillText('ODD LITTLE GAMES™',380,85);c.font='900 60px system-ui';c.fillText('포장 좀 해주세요!',380,163);c.fillStyle='#c6e8d5';c.fillRect(75,207,610,515);c.drawImage(cv,75,207,610,515);c.fillStyle='#26332a';c.font='900 44px system-ui';c.fillText($('verdict').textContent,380,800);c.font='bold 25px system-ui';c.fillText('사용한 테이프 '+Math.round(used/12)+'cm • WRAP IT UP!',380,860);return out.toDataURL('image/png')}
$('done').onclick=()=>{canDraw=false;const n=Math.round(used/12),air=round===2;let title,comment;if(air){title='공기가 숨을 못 쉬어요!';comment=n>25?'손님: “공기에도 숨 쉴 공간이 필요하잖아요!”':'손님: “아니 공기가 어디 갔죠?”'}else if(n<12){title='이게 포장인가요?';comment='손님: “물건이 그대로 보이는데요?”'}else if(n<75){title='가볍고 산뜻해요';comment='손님: “조금 불안한데... 예쁘긴 하네요.”'}else if(n<200){title='과잉 보호 전문가';comment='손님: “뜯는 데 3일 걸리겠어요.”'}else{title='테이프 미라 탄생';comment='손님: “상자가 아직 살아 있나요?”'}$('verdict').textContent=title;$('reaction').textContent=comment;$('stats').textContent='총 '+n+'cm 사용 · '+orders[round].name+' 포장';$('outEyebrow').textContent='ORDER '+(round+1)+' / 03 · CUSTOMER REVIEW';$('thumb').src=makeImage();$('next').textContent=round===2?'다시 포장하기 ↺':'다음 손님 →';$('overlay').classList.add('show')};$('next').onclick=()=>{round=(round+1)%3;lines=[];current=null;used=0;canDraw=true;$('overlay').classList.remove('show');$('round').textContent='ORDER 0'+(round+1)+'/03';$('label').textContent='CUSTOMER #0'+(round+1)+' · '+orders[round].icon;$('request').textContent=orders[round].title;count();draw()};$('save').onclick=()=>{let a=document.createElement('a');a.href=makeImage();a.download='wrap-it-up-order-'+(round+1)+'.png';a.click()};window.addEventListener('resize',resize);resize();count()})();
</script></body></html>
