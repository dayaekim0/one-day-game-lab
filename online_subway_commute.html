<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f3653">
<title>온라인 퇴근 지하철 3D</title>
<style>
:root{--ink:#3d3550;--sub:#85799a;--cream:#fff8ef;--line:#ecdcc8;--mint:#5fc49a;--pink:#ff9fb6;--butter:#ffd77a;--lav:#b7a6ff;--sky:#8fd0ff;--danger:#ff7f8f;--l2:#3db46d;--sh:0 6px 18px rgba(30,24,50,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2f3653;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{position:fixed;inset:0}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#touch{position:fixed;inset:0;z-index:2;touch-action:none}
#labels{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.anc{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;will-change:transform}
.bub{position:relative;background:#fff;color:var(--ink);font-size:12.5px;font-weight:800;line-height:1.3;padding:6px 10px;border-radius:14px;box-shadow:0 3px 0 rgba(40,30,60,.12),0 6px 14px rgba(0,0,0,.12);max-width:190px;white-space:normal;text-align:center;animation:pop .22s cubic-bezier(.3,1.6,.5,1)}
.bub:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.bub small{display:block;font-size:9.5px;font-weight:800;color:#9a90ab;letter-spacing:.3px}
.bub.loud{background:#ffe774;font-size:14px;animation:pop .22s cubic-bezier(.3,1.6,.5,1),wob .18s .22s infinite alternate}
.bub.loud:after{border-top-color:#ffe774}
.bub.quiet{background:#eef0ff;font-size:11px;color:#7d7aa0}
.bub.quiet:after{border-top-color:#eef0ff}
.bub.zzz{background:transparent;box-shadow:none;color:#e3e8ff;font-size:17px;text-shadow:0 2px 6px rgba(0,0,0,.35);animation:zz 1.6s ease-in-out infinite}
.bub.zzz:after{display:none}
.bub.react{font-size:17px;padding:3px 8px}
.bub.me{background:#e9fff5}
.bub.me:after{border-top-color:#e9fff5}
.tag{font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:99px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.tag.human{background:var(--mint);color:#fff}
.tag.villain{background:#fff0f2;color:#e2566c;border:1.5px solid #ffc2cc}
.mark{font-size:19px;animation:bob 1s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes wob{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(1.06)}}
@keyframes zz{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-6px);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* HUD */
#hud{position:fixed;z-index:5;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none;transition:opacity .3s}
.hide{opacity:0!important;pointer-events:none!important}
.gone{display:none!important}
.panel{background:rgba(255,248,239,.94);border:2px solid #f1e2cf;border-radius:18px;box-shadow:var(--sh)}
#topbar{display:flex;gap:6px;align-items:stretch}
#route{flex:1;padding:7px 10px 6px;position:relative}
#routeLine{position:relative;height:30px;margin:0 8px}
#routeLine .ln{position:absolute;left:0;right:0;top:7px;height:5px;border-radius:9px;background:#d8eadf}
#routeLine .fill{position:absolute;left:0;top:7px;height:5px;border-radius:9px;background:var(--l2);transition:width .2s linear}
#routeLine .st{position:absolute;top:2px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:#fff;border:3px solid #bcd9c7}
#routeLine .st.on{border-color:var(--l2);background:#fff}
#routeLine .st.cur{border-color:var(--l2);background:var(--l2);box-shadow:0 0 0 4px rgba(61,180,109,.2)}
#routeLine .st span{position:absolute;top:15px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;white-space:nowrap;color:var(--sub)}
#routeLine .st.cur span{color:var(--l2)}
#routeLine .trainIco{position:absolute;top:-7px;font-size:15px;margin-left:-9px;transition:left .2s linear}
#sideBtns{display:flex;flex-direction:column;gap:5px;pointer-events:auto}
.ibtn{width:38px;height:38px;border-radius:13px;border:2px solid #f1e2cf;background:rgba(255,248,239,.94);font-size:17px;box-shadow:var(--sh);display:grid;place-items:center;padding:0}
#meters{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.meter{padding:6px 10px 7px}
.meter .lb{display:flex;justify-content:space-between;font-size:11px;font-weight:900;color:var(--sub)}
.meter .lb b{color:var(--ink);font-size:13px}
.meter .bar{height:7px;border-radius:9px;background:#efe4d6;margin-top:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;border-radius:9px;transition:width .25s}
#stressB{background:linear-gradient(90deg,#ffd36b,#ff8f8a,#ff6f95)}
#patB{background:linear-gradient(90deg,#8fe0b5,#7fd2e0,#8fb8ff)}
.meter.flash{animation:fl .4s}
@keyframes fl{30%{transform:scale(1.04);background:#ffe3e7}}
#msg{align-self:center;max-width:min(92vw,420px);padding:8px 14px;font-size:13px;font-weight:800;line-height:1.4;text-align:center;transition:opacity .25s,transform .25s}
#msg.off{opacity:0;transform:translateY(-6px)}
#warn{align-self:center;padding:6px 14px;border-radius:99px;background:#ffefc2;border:2px solid #ffd36b;font-size:12.5px;font-weight:900;color:#a0661a;animation:wob .2s infinite alternate}

/* station sign */
#sign{position:fixed;z-index:6;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;transition:opacity .3s,transform .35s cubic-bezier(.3,1.5,.5,1);background:#fff;border-radius:20px;box-shadow:0 14px 40px rgba(0,0,0,.35);padding:14px 22px 12px 16px;display:flex;align-items:center;gap:14px;min-width:250px}
#sign.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#sign .no{width:48px;height:48px;border-radius:50%;background:var(--l2);color:#fff;font-weight:1000;font-size:26px;display:grid;place-items:center;flex:none}
#sign .ko{font-size:34px;font-weight:1000;letter-spacing:-1px;line-height:1}
#sign .en{font-size:12px;font-weight:800;color:#8a8a9a;margin-top:3px}
#sign .sub{font-size:11.5px;font-weight:900;color:var(--l2);margin-bottom:4px}

/* joystick */
#joy{position:fixed;z-index:4;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.5);pointer-events:none;opacity:0;transition:opacity .15s}
#joy.on{opacity:1}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,248,239,.95);box-shadow:var(--sh)}
#joyHint{position:fixed;z-index:4;left:calc(env(safe-area-inset-left) + 18px);bottom:calc(env(safe-area-inset-bottom) + 22px);width:96px;height:96px;border-radius:50%;border:3px dashed rgba(255,255,255,.45);display:grid;place-items:center;color:rgba(255,255,255,.8);font-size:11px;font-weight:900;text-align:center;pointer-events:none;line-height:1.3}

/* actions */
#acts{position:fixed;z-index:6;right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.act{border:none;border-radius:20px;padding:12px 18px 12px 14px;min-width:132px;font-size:15px;font-weight:900;background:#fff8ef;box-shadow:0 4px 0 #e2cdb4,var(--sh);display:flex;align-items:center;gap:8px;animation:pop .2s}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 #e2cdb4,var(--sh)}
.act .e{font-size:21px}
.act.hot{background:var(--butter);box-shadow:0 4px 0 #e2b04d,var(--sh)}
.act.mint{background:#c9f2df;box-shadow:0 4px 0 #8fd1b2,var(--sh)}

/* villain panel */
#vp{position:fixed;z-index:7;left:0;right:0;margin:0 auto;bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(94vw,420px);padding:11px 12px 12px;animation:pop .22s}
body.vpOn #acts{bottom:calc(env(safe-area-inset-bottom) + 196px)}
body.vpOn #joyHint{display:none}
#vp .hd{display:flex;gap:10px;align-items:center}
#vp .em{font-size:30px;width:46px;height:46px;border-radius:14px;background:#ffe9ed;display:grid;place-items:center;flex:none}
#vp .ey{font-size:10px;font-weight:900;color:#e2566c;letter-spacing:1px}
#vp .nm{font-size:18px;font-weight:1000}
#vp .ds{font-size:12px;color:var(--sub);font-weight:700;line-height:1.4;margin-top:6px}
#vp .bt{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
#vp .bt button{border:none;border-radius:14px;padding:11px 4px;font-size:13.5px;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.12)}
#vp .bt button:active{transform:translateY(2px)}
#vp [data-c=endure]{background:#d7ecff}#vp [data-c=move]{background:#ffe9a8}#vp [data-c=glare]{background:#ffd0dc}

/* overlays */
.ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;pointer-events:none}
.sheet{pointer-events:auto;width:min(100%,460px);max-height:62vh;overflow:auto;background:var(--cream);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding:16px 16px calc(env(safe-area-inset-bottom) + 14px);-webkit-overflow-scrolling:touch}
@media (min-aspect-ratio:1/1){.ov{justify-content:center;align-items:flex-end;padding-right:3vw}.sheet{border-radius:26px;max-height:92vh}}
#introTitle{position:fixed;z-index:9;left:0;right:0;top:calc(env(safe-area-inset-top) + 14px);text-align:center;pointer-events:none;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.35)}
#introTitle .ey{font-size:11px;font-weight:900;letter-spacing:1.6px;opacity:.85}
#introTitle h1{margin:4px 0 0;font-size:30px;letter-spacing:-1.2px;line-height:1.05}
.sheet h2{margin:0 0 2px;font-size:17px}
.sheet .sm{font-size:12px;color:var(--sub);font-weight:700;margin:0 0 10px;line-height:1.45}
.row{margin:10px 0}
.row .lb{font-size:11.5px;font-weight:900;color:var(--sub);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:800}
.chip.on{border-color:var(--ink);background:#fff3d6}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
#nick{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:16px;font-weight:800;font-family:inherit;color:var(--ink);background:#fff;-webkit-user-select:text;user-select:text}
.big{width:100%;border:none;border-radius:18px;padding:15px;font-size:17px;font-weight:1000;background:var(--mint);color:#fff;box-shadow:0 4px 0 #3fa37a;margin-top:6px}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #3fa37a}
.ghost{width:100%;border:2px dashed var(--line);background:transparent;border-radius:16px;padding:10px;font-size:13px;font-weight:800;color:var(--sub);margin-top:8px}
#result .sheet{max-height:94vh;border-radius:26px 26px 0 0}
#cardImg{width:100%;border-radius:18px;display:block;box-shadow:0 6px 20px rgba(0,0,0,.15);background:#f3e7d7;aspect-ratio:4/5}
.btn3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.btn3 button{border:none;border-radius:16px;padding:13px 6px;font-size:14px;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.12)}
#shareBtn{background:#9fd8ff}#saveBtn{background:var(--butter)}#restartBtn{background:#ffc2d1}
#fade{position:fixed;inset:0;z-index:9;background:#fff8ef;opacity:0;pointer-events:none;transition:opacity .6s}
#loading{position:fixed;inset:0;z-index:20;background:#2f3653;color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px;text-align:center;line-height:1.6;padding:20px}
#toast{position:fixed;z-index:30;left:50%;bottom:calc(env(safe-area-inset-bottom) + 40%);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch"></div>
<div id="labels"></div>
<div id="joy"><i></i></div>
<div id="joyHint" class="gone">화면을<br>드래그해서<br>이동</div>

<div id="hud" class="hide">
  <div id="topbar">
    <div id="route" class="panel"><div id="routeLine"><div class="ln"></div><div class="fill" id="routeFill"></div></div></div>
    <div id="sideBtns"><button class="ibtn" id="soundBtn" aria-label="소리">🔈</button><button class="ibtn" id="inviteBtn" aria-label="친구 초대">👥</button></div>
  </div>
  <div id="meters">
    <div class="meter panel" id="stressM"><div class="lb">스트레스 <b id="stressV">0</b></div><div class="bar"><i id="stressB"></i></div></div>
    <div class="meter panel" id="patM"><div class="lb">인내심 <b id="patV">100</b></div><div class="bar"><i id="patB"></i></div></div>
  </div>
  <div id="msg" class="panel off"></div>
  <div id="warn" class="gone">⚠️ 덜컹 주의! 손잡이를 잡거나 앉으세요</div>
</div>

<div id="sign"><div class="no">2</div><div><div class="sub" id="signSub">이번 역은</div><div class="ko" id="signKo">강남</div><div class="en" id="signEn">Gangnam</div></div></div>
<div id="acts" class="gone"></div>
<div id="vp" class="panel gone">
  <div class="hd"><div class="em" id="vpE">😑</div><div><div class="ey">TODAY'S SUBWAY VILLAIN</div><div class="nm" id="vpN">쩍벌맨</div></div></div>
  <div class="ds" id="vpD"></div>
  <div class="bt"><button data-c="endure">😮‍💨 참기</button><button data-c="move">🚶 슬쩍 이동</button><button data-c="glare">👀 눈치 주기</button></div>
</div>

<div id="introTitle"><div class="ey">AMOOGONA · ONLINE SPACE LAB</div><h1>온라인 퇴근 지하철 🚇</h1></div>
<div id="intro" class="ov">
  <div class="sheet">
    <h2>오늘의 퇴근러 꾸미기</h2>
    <p class="sm">빈자리 사수, 지하철 빌런 회피, 집까지 멘탈 유지하기.<br>강남 → 집, 다섯 정거장 생존 시뮬레이터.</p>
    <div class="row"><div class="lb">닉네임</div><input id="nick" maxlength="10" placeholder="퇴근러" autocomplete="off"></div>
    <div class="row"><div class="lb">헤어스타일</div><div class="chips" id="optHair"></div></div>
    <div class="row"><div class="lb">머리 색</div><div class="chips" id="optHairColor"></div></div>
    <div class="row"><div class="lb">옷 색</div><div class="chips" id="optOutfit"></div></div>
    <div class="row"><div class="lb">피부 톤</div><div class="chips" id="optSkin"></div></div>
    <div class="row"><div class="lb">가방</div><div class="chips" id="optBag"></div></div>
    <div class="row"><div class="lb">소품</div><div class="chips" id="optAcc"></div></div>
    <button class="big" id="startBtn">탑승 시작 🚇</button>
    <button class="ghost" id="inviteBtn2">👥 친구 초대 링크 만들기 (멀티플레이 준비 중)</button>
  </div>
</div>
<div id="result" class="ov gone">
  <div class="sheet">
    <img id="cardImg" alt="오늘의 퇴근 결과 카드">
    <div class="btn3"><button id="shareBtn">결과 공유</button><button id="saveBtn">카드 저장</button><button id="restartBtn">다시 퇴근</button></div>
  </div>
</div>
<div id="fade"></div>
<div id="toast"></div>
<div id="loading">🚇 열차 들어오는 중…</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ───────────────────────── 데이터 ─────────────────────────
const STATIONS = [
  {ko:'강남', en:'Gangnam'}, {ko:'선릉', en:'Seolleung'}, {ko:'역삼', en:'Yeoksam'},
  {ko:'잠실', en:'Jamsil'}, {ko:'집', en:'Home Sweet Home'}
];
const VILLAINS = {
  manspreader:{name:'쩍벌맨', emoji:'😑',
    desc:'다리를 넓게 벌린 채 양옆 두 좌석의 평화를 동시에 차지하는 전설의 타입.',
    endure:{stress:18, patience:-14, text:'참았지만 무릎이 정신적으로 접혔다.'},

    endure:{stress:16, patience:-10, text:'가방에 두 번 치였지만 영혼은 지켰다.'},

    desc:'“어어 지금 지하철~”로 시작해 본인의 하루를 객차 전체와 공유한다.',

    glare:{stress:8, patience:-8, text:'눈치를 줬지만 볼륨이 1만 줄었다.'}},
  leaner:{name:'꾸벅 기대러', emoji:'😴',
    desc:'졸면서 서서히 어깨를 정복한다. 죄는 없지만 매우 버거움.',

  foodie:{name:'간식 먹방러', emoji:'🥟',
    desc:'만두인지 핫도그인지 알 수 없는 강한 향으로 객차를 채운다.',
    endure:{stress:11, patience:-6, text:'화나기보다 배가 고파졌다. 집 가서 라면 각.'},
    move:{stress:6, patience:-2, text:'향기 풍향을 피해 이동 성공.'},

class LocalRoom{
  constructor(code){this.code=code||null;this.players=new Map();this.handlers={};}
  on(ev,fn){(this.handlers[ev]||(this.handlers[ev]=[])).push(fn);}
  emit(ev,data){(this.handlers[ev]||[]).forEach(f=>f(data));}
  join(profile){this.players.set(profile.id,profile);this.emit('join',profile);}
  sendState(_state){/* 싱글 모드: 전송할 상대 없음 */}
}

function spawnVillain(type){

  after(1.6,()=>{if(player.state!=='sit'){const fs=seats.filter(seatFree);if(fs.length){
    const s=fs.sort((a,b)=>dist(a.x,a.frontZ,player.x,player.z)-dist(b.x,b.frontZ,player.x,player.z))[0];
    const r=makeCommuter({name:'칼좌석러',lines:['자리는 먼저 본 사람이 임자죠!','(숨 고르는 중)']});r.role='commuter';
    boardAgent(r,{x:s.x,z:s.frontZ},{speed:3.1,door:nearestDoor(s.x),cb:()=>{if(s.occupant||s.blockedBy){s.reserved=null;r.say('아… 한발 늦었다',1.8,'quiet');goStand(r);return;}
      r.sitOn(s);r.say('나이스~ 😎',1.6,'');if(dist(player.x,player.z,s.x,s.frontZ)<2.2&&player.state!=='sit'){G.steals++;stressAdd(8,-6);setMsg('눈앞에서 자리를 뺏겼다. 저 민첩함 뭐야?',3);playerSay('헐…',null);}}});
    s.reserved=r;after(.6,()=>r.say('💨 자리다!!',1.6,'loud'));}}});
  after(2.4,()=>vs.forEach((type,i)=>after(i*1.1,()=>spawnVillain(type))));
  const boarders=1+Math.floor(Math.random()*2);
  for(let i=0;i<boarders;i++)after(1.0+i*.8,()=>{if(agents.length>22)return;const a=makeCommuter();const fs=seats.filter(seatFree);
    if(fs.length&&Math.random()<.7){const s=pick(fs);s.reserved=a;boardAgent(a,{x:s.x,z:s.frontZ},{cb:()=>{if(s.occupant||s.blockedBy){s.reserved=null;goStand(a);}else a.sitOn(s);}});}
    else{const s=freeStrap(rand(-5,5));if(s){s.reserved=a;boardAgent(a,{x:s.x,z:s.standZ},{cb:()=>{s.reserved=null;if(s.holder)a.c.anim='idle';else a.holdStrap(s);}});}}});
}
function startFinal(){

  showSign(STATIONS[4],'도착 · 내리실 문은 오른쪽');updateDisplays();

function planJolts(){T.jolts=[{t:.7,dir:-1},{t:rand(9,15),dir:pick([-1,1]),mid:true},{t:RIDE-2.3,dir:1}];}
function fireJolt(dir,mid){
  thud();camShake=.35;$('warn').classList.add('gone');
  for(const a of agents){if(a===player||a.state==='sit'||a.path.length)continue;if(a.state==='stand'||Math.random()<.3)a.c.stumble(dir);}
  if(player.state==='stand'&&!player.trans){player.c.stumble(dir);G.stumbles++;stressAdd(6,-3);
    player.knock={vx:-dir*1.6,vz:0,t:.35};playerSay(pick(['으악!','어어어?!','(휘청)','살려줘…']),null);
    setMsg(mid?'덜컹! 손잡이를 잡았으면 안 넘어졌을 텐데…':'열차가 흔들립니다! 손잡이를 꼭 잡아주세요 🙏',2.6);
    const n=agents.find(a=>a.role==='commuter'&&dist(a.x,a.z,player.x,player.z)<1.8);if(n)n.say(pick(['괜찮아요?','(움찔)','조심하세요~']),1.6,'');}

function updateTrain(dt,t){
  for(const d of DOORS){d.open=damp(d.open,d.target,4.5,dt);const e=d.open;d.panels[0].position.x=d.x-.3125-e*.6;d.panels[1].position.x=d.x+.3125+e*.6;}
  if(G.phase!=='play'&&G.phase!=='exiting'){platform.position.x=0;T.v=0;T.accel=0;return;}
  for(let i=sched.length-1;i>=0;i--){sched[i].t-=dt;if(sched[i].t<=0){const f=sched[i].fn;sched.splice(i,1);f();}}
  T.t+=dt;const prevV=T.v;
  if(T.phase==='board'){T.v=0;if(!T.closingSaid&&T.t>T.boardTime-2.2){T.closingSaid=true;setMsg('🔔 출입문 닫습니다~ 손잡이 준비!',2.2);chime(true);}
    if(T.t>=T.boardTime){closeDoors();T.phase='closing';T.t=0;}}
  else if(T.phase==='closing'){T.v=0;if(T.t>=1.4){T.phase='ride';T.t=0;planJolts();setMsg(`다음 역은 ${STATIONS[G.stationIndex+1].ko}. 흔들림에 주의하세요.`,2.6);}}
  else if(T.phase==='ride'){
    const tt=Math.min(T.t,RIDE);T.v=vAt(tt);T.s=sAt(tt);
    for(const j of T.jolts){if(!j.warned&&tt>=j.t-1.4){j.warned=true;if(player.state==='stand')$('warn').classList.remove('gone');}if(!j.done&&tt>=j.t){j.done=true;fireJolt(j.dir,j.mid);}}
    if(!T.announced&&tt>=RIDE-7){T.announced=true;const n=STATIONS[G.stationIndex+1];showSign(n,G.stationIndex+1===4?'이번 역은 · 내리실 역':'이번 역은');chime();setMsg(`이번 역은 ${n.ko}, ${n.ko}역입니다.`,3);}
    G.rideTime+=dt;if(player.state==='sit'){G.seatTime+=dt;stressAdd(-.25*dt,.06*dt);}if(player.state==='hold')G.holdTime+=dt;
    if(T.t>=RIDE){G.stationIndex++;T.v=0;T.s=0;if(G.stationIndex>=4)startFinal();else startBoard(false);}
  }
  T.accel=damp(T.accel,(T.v-prevV)/Math.max(dt,1e-3),6,dt);
  for(const m of tunnelLights){m.position.x-=T.v*dt;if(m.position.x<-48)m.position.x+=96;m.scale.x=1+T.v*.14;}
  let off=0,st=G.stationIndex;
  if(T.phase==='ride'){if(T.s<TRACK/2)off=-T.s;else{off=TRACK-T.s;st=G.stationIndex+1;}}
  setPlatformStation(Math.min(st,4));platform.position.x=off;platform.visible=Math.abs(off)<70;
}

const joy={id:null,ox:0,oy:0,x:0,y:0};
const touchEl=$('touch'),joyEl=$('joy');
touchEl.addEventListener('pointerdown',e=>{if(joy.id!==null||G.phase!=='play')return;joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.x=joy.y=0;
  joyEl.style.left=e.clientX+'px';joyEl.style.top=e.clientY+'px';joyEl.classList.add('on');joyEl.firstChild.style.transform='';try{touchEl.setPointerCapture(e.pointerId);}catch(_){}$('joyHint').classList.add('gone');});
touchEl.addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const l=Math.hypot(dx,dy),mx=52;if(l>mx){dx*=mx/l;dy*=mx/l;}
  joy.x=dx/mx;joy.y=dy/mx;joyEl.firstChild.style.transform=`translate(${dx}px,${dy}px)`;});
const joyEnd=e=>{if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;joyEl.classList.remove('on');};

const camFwd=new THREE.Vector3(0,0,-1),camRight=new THREE.Vector3(1,0,0);
function snap(x,z,yaw,dur,done){player.trans={x0:player.x,z0:player.z,x1:x,z1:z,t:0,dur,done};if(yaw!=null)player.targetYaw=yaw;}
function dynamicCircles(){const out=[];for(const a of agents){if(a===player||a.state==='sit'||a.gone)continue;if(a.circles)out.push(...a.circles());else out.push({x:a.x,z:a.z,r:.2});}return out;}
function collide(e,r){
  const dyn=dynamicCircles();
  for(let it=0;it<3;it++){
    for(const b of BOXES){const cx=clamp(e.x,b.x0,b.x1),cz=clamp(e.z,b.z0,b.z1),dx=e.x-cx,dz=e.z-cz,d2=dx*dx+dz*dz;if(d2>=r*r)continue;
      if(d2>1e-9){const d=Math.sqrt(d2);e.x=cx+dx/d*r;e.z=cz+dz/d*r;}
      else{const l=e.x-b.x0,rt=b.x1-e.x,tp=e.z-b.z0,bt=b.z1-e.z,m=Math.min(l,rt,tp,bt);if(m===l)e.x=b.x0-r;else if(m===rt)e.x=b.x1+r;else if(m===tp)e.z=b.z0-r;else e.z=b.z1+r;}}
    for(const c of POLES.concat(dyn)){const dx=e.x-c.x,dz=e.z-c.z,R=r+c.r,d2=dx*dx+dz*dz;if(d2>=R*R)continue;const d=Math.sqrt(d2);
      if(d<1e-4){e.x=c.x+R;}else{e.x=c.x+dx/d*R;e.z=c.z+dz/d*R;}if(c.onHit)c.onHit();}
  }
}
function updatePlayer(dt,t){
  const p=player;p.c.poseT.lean=0;p.c.body.scale.x=damp(p.c.body.scale.x,1,8,dt);
  if(p.trans){p.trans.t+=dt/p.trans.dur;const e=Math.min(1,p.trans.t),k=e*e*(3-2*e);p.x=lerp(p.trans.x0,p.trans.x1,k);p.z=lerp(p.trans.z0,p.trans.z1,k);
    if(p.c.anim!=='sit'&&p.c.anim!=='hold')p.c.anim='walk';if(e>=1){const cb=p.trans.done;p.trans=null;cb&&cb();}return;}
  if(G.phase==='exiting'){
    if(p.exitPath&&p.exitPath.length){const q=p.exitPath[0],dx=q.x-p.x,dz=q.z-p.z,d=Math.hypot(dx,dz);
      if(d<.05){p.exitPath.shift();if(!p.exitPath.length){p.targetYaw=0;p.c.anim='idle';p.c.poseT.cheer=1;p.say('집이다~!! 🏠',2.4,'me');setTimeout(finishGame,1300);}}
      else{const s=Math.min(d,1.8*dt);p.x+=dx/d*s;p.z+=dz/d*s;p.targetYaw=Math.atan2(dx,dz);p.c.anim='walk';}}
    return;}
  let ix=joy.x,iy=joy.y;
  if(keys.KeyA||keys.ArrowLeft)ix-=1;if(keys.KeyD||keys.ArrowRight)ix+=1;if(keys.KeyW||keys.ArrowUp)iy-=1;if(keys.KeyS||keys.ArrowDown)iy+=1;
  let mag=Math.hypot(ix,iy);if(mag>1){ix/=mag;iy/=mag;mag=1;}
  if(mag>.25&&p.autoPath)p.autoPath=null;
  if(p.state==='sit'){p.c.anim='sit';if(mag>.75){p.standHold=(p.standHold||0)+dt;if(p.standHold>.3){p.standHold=0;doStand();}}else p.standHold=0;return;}
  if(p.state==='hold'){if(mag>.35)doRelease();else{p.c.anim='hold';return;}}
  let vx=0,vz=0;const SPEED=2.3;
  if(mag>.08){vx=(camRight.x*ix-camFwd.x*iy)*SPEED;vz=(camRight.z*ix-camFwd.z*iy)*SPEED;}
  else if(p.autoPath&&p.autoPath.length){const q=p.autoPath[0],dx=q.x-p.x,dz=q.z-p.z,d=Math.hypot(dx,dz);p.autoT=(p.autoT||0)+dt;
    if(d<.12||p.autoT>4){p.autoPath.shift();p.autoT=0;if(!p.autoPath.length){const cb=p.autoDone;p.autoDone=null;cb&&cb();}}else{vx=dx/d*2;vz=dz/d*2;}}
  p.vx=damp(p.vx,vx,12,dt);p.vz=damp(p.vz,vz,12,dt);
  let kx=0,kz=0;if(p.knock){kx=p.knock.vx;kz=p.knock.vz;p.knock.t-=dt;if(p.knock.t<=0)p.knock=null;}
  p.x+=(p.vx+kx)*dt;p.z+=(p.vz+kz)*dt;collide(p,PR);
  const sp=Math.hypot(p.vx,p.vz);
  if(sp>.2){p.targetYaw=Math.atan2(p.vx,p.vz);p.c.anim='walk';p.c.stepRate=6+sp*3;}else p.c.anim='idle';
  p.c.poseT.lean=0;
}

function nearestFreeSeat(){let best=null,bd=.55;for(const s of seats){if(s.occupant)continue;const d=dist(player.x,player.z,s.x,s.frontZ);if(d<bd){bd=d;best=s;}}return best;}
function nearestStrap(){let best=null,bd=.5;for(const s of straps){if(s.holder)continue;const d=dist(player.x,player.z,s.x,s.standZ);if(d<bd){bd=d;best=s;}}return best;}
function nearestNPC(){let best=null,bd=1.15;for(const a of agents){if(a===player||a.role!=='commuter'||a.leaving||a.path.length)continue;const d=dist(player.x,player.z,a.x,a.z);if(d<bd){bd=d;best=a;}}return best;}
function nearestVillain(){let best=null,bd=1.35;for(const v of G.villains){if(v.gone||!v.ready||v.resolved||v.leaving)continue;const d=dist(player.x,player.z,v.x,v.z);if(d<bd){bd=d;best=v;}}return best;}
const exitZone=()=>dist(player.x,player.z,DOORS[1].x,-1.08)<.75;
let currentActs=[];
function computeActs(){
  const p=player,a=[];if(G.phase!=='play'||p.trans)return a;
  if(T.phase==='final'&&p.state!=='sit'&&exitZone())a.push({id:'exit',icon:'🚪',label:'내리기',cls:'hot'});
  if(p.state==='sit')a.push({id:'stand',icon:'🧍',label:'일어나기'});
  if(p.state==='hold')a.push({id:'release',icon:'✋',label:'손 놓기'});
  if(p.state==='stand'){const s=nearestFreeSeat();if(s)a.push({id:'sit',icon:'💺',label:s.type==='pink'?'앉기 (임산부석)':s.type==='prio'?'앉기 (노약자석)':s.blockedBy?'앉기 (좁음 주의)':'앉기',cls:'mint',seat:s});
    const st=nearestStrap();if(st)a.push({id:'hold',icon:'✊',label:'손잡이 잡기',strap:st});}
  const n=nearestNPC();if(n)a.push({id:'talk',icon:'💬',label:'말 걸기',npc:n});
  return a.slice(0,3);
}
function renderActs(){
  const acts=computeActs();const key=acts.map(a=>a.id+a.label).join('|');currentActs=acts;
  const el=$('acts');if(el.dataset.key!==key){el.dataset.key=key;el.innerHTML='';acts.forEach((a,i)=>{const b=document.createElement('button');b.className='act '+(a.cls||'');b.innerHTML=`<span class="e">${a.icon}</span>${a.label}`;b.onclick=()=>{const cur=currentActs[i];if(cur)doAct(cur);};el.appendChild(b);});}
  el.classList.toggle('gone',!acts.length||G.phase!=='play');

  else{G.focusV=null;vp.classList.add('gone');document.body.classList.remove('vpOn');}
}
function doAct(a){
  const p=player;pop();
  if(a.id==='sit'){const s=a.seat;if(s.occupant)return;s.occupant=p;p.seat=s;if(s.reserved&&s.reserved!==p){/* 먼저 앉은 사람이 임자 */}
    snap(s.x,s.sitZ,s.yaw,.3,()=>{p.state='sit';p.c.anim='sit';});p.c.anim='sit';p.state='sit';
    if(s.type==='pink')playerSay('(앗, 임산부 배려석… 잠깐만 앉을게요)',null);else if(s.type==='prio'){playerSay('(노약자석인데… 괜찮겠지?)',null);stressAdd(0,-2);}
    else if(s.blockedBy&&!s.blockedBy.calm)playerSay('(옆자리 다리가… 넓다)',null);else playerSay(pick(['오예! 빈자리 확보 😆','앉았다…! 행복','엉덩이 착지 성공']),null);
    if(!G.firstSit){G.firstSit=true;setMsg('오예! 빈자리 확보 성공. 하지만 방심은 금물…',3);}}
  else if(a.id==='stand')doStand();
  else if(a.id==='hold'){const s=a.strap;s.holder=p;p.strap=s;p.state='hold';snap(s.x,s.standZ,s.side<0?Math.PI:0,.25,()=>{p.c.anim='hold';});p.c.anim='hold';$('warn').classList.add('gone');
    if(!G.firstHold){G.firstHold=true;setMsg('손잡이를 잡으면 덜컹거려도 넘어지지 않는다 💪',2.8);}}
  else if(a.id==='release')doRelease();
  else if(a.id==='talk'){const n=a.npc;playerSay(pick(['저기요~','안녕하세요!','퇴근하세요?']),null,0);n.targetYaw=Math.atan2(p.x-n.x,p.z-n.z);
    setTimeout(()=>{n.say(pick(n.lines),2.8,'',`NPC · ${n.name}`);if(!n.talked){n.talked=true;G.chats++;if(n.gift){stressAdd(-8,6);setTimeout(()=>playerSay('사탕 받았다 🍬 (스트레스 -8)',null),900);}else stressAdd(-2,1);}},450);}
  else if(a.id==='exit'){const dk=G.villains.find(v=>v.vtype==='doorkeeper'&&!v.gone);
    if(dk&&!dk.resolved){stressAdd(2,-2,dk);dk.say('(꿈쩍)',1.2,'quiet');playerSay('저 내려야 하는데요…',null);setMsg('문앞 수문장이 길을 막고 있다! 대응해보자 👇',2.6);return;}
    G.phase='exiting';p.state='stand';closeAllUI();p.exitPath=[{x:DOORS[1].x,z:-1.15},{x:DOORS[1].x,z:-2.15},{x:DOORS[1].x,z:-2.55}];}
}
function doStand(){const p=player,s=p.seat;if(!s)return;if(s.occupant===p)s.occupant=null;p.seat=null;p.c.poseT.lean=0;snap(s.x,s.frontZ,null,.22,()=>{p.state='stand';p.c.anim='idle';});p.state='stand';p.c.anim='idle';}

function moveAway(v){

// ───────────────────────── 카메라 ─────────────────────────
let camShake=0;const camTarget=new THREE.Vector3(-3.6,.6,0);const camPos=new THREE.Vector3(-2,5,8);
function updateCamera(dt,t){
  const asp=camera.aspect,vf=T.v/VMAX;
  if(G.phase==='intro'){
    camera.fov=damp(camera.fov,46,4,dt);
    const land=asp>1;
    const tgt=land?new THREE.Vector3(player.x+.75,.55,player.z):new THREE.Vector3(player.x,-.9,player.z);
    const pos=land?new THREE.Vector3(player.x+.15,.95,player.z+2.4):new THREE.Vector3(player.x+.2,1.3,player.z+5.5);
    camPos.lerp(pos,1-Math.exp(-dt*4));camTarget.lerp(tgt,1-Math.exp(-dt*4));
  }else{
    camera.fov=damp(camera.fov,asp<.8?48:40,3,dt);
    const zoom=asp<.8?1.5:1,p=player;
    const tgt=new THREE.Vector3(p.x,.5,p.z*.4-(asp<.8?.95:.3));
    const pos=new THREE.Vector3(p.x+1.1*zoom,4.7*zoom,p.z*.3+6.4*zoom);
    camPos.lerp(pos,1-Math.exp(-dt*3.2));camTarget.lerp(tgt,1-Math.exp(-dt*4.5));
  }
  camera.position.copy(camPos);
  camShake=Math.max(0,camShake-dt);
  const sh=.006*vf+camShake*.06;
  camera.position.x+=Math.sin(t*23)*sh;camera.position.y+=Math.sin(t*31+1)*sh;
  camera.lookAt(camTarget);camera.updateProjectionMatrix();
  carriage.position.y=Math.sin(t*29)*.004*vf+(camShake>0?Math.sin(t*50)*.01*camShake:0);
  carriage.rotation.x=Math.sin(t*3.1)*.002*vf;
  const d=new THREE.Vector3().subVectors(camTarget,camPos);d.y=0;d.normalize();camFwd.copy(d);camRight.set(-d.z,0,d.x);
}

// ───────────────────────── 사운드 (작은 효과음) ─────────────────────────
let AC=null,soundOn=store.get('subway3d.sound',true);
function tone(f,dur,type='sine',vol=.05,delay=0){if(!AC||!soundOn)return;const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+dur+.05);}
function chime(close){if(close){tone(660,.3);tone(523,.45,'sine',.05,.25);}else{tone(784,.3);tone(988,.45,'sine',.05,.22);}}

// ───────────────────────── 결과 카드 ─────────────────────────
function getResult(){
  const s=Math.round(G.stress),p=Math.round(G.patience);
  if(s<=25&&p>=70)return{emoji:'😇',title:'평화주의 좌석헌터',desc:'용케도 오늘 무사 퇴근했다. 자리도 잘 잡고 멘탈도 지킨 타입.'};
  if(s<=45&&p>=55)return{emoji:'😎',title:'지옥철 생존고수',desc:'적당히 피하고, 적당히 참으며, 현실적으로 살아남는 현명한 타입.'};
  if(s<=70)return{emoji:'😵‍💫',title:'참기의 인간화',desc:'속으로는 백 번 소리쳤지만 겉으로는 조용히 버틴 퇴근러.'};
  if(p<35)return{emoji:'🤯',title:'분노 폭발 1초 전',desc:'오늘의 지하철은 너무했다. 침대에 눕는 순간까지 억울할 예정.'};
  return{emoji:'🫠',title:'멘탈 용해형 퇴근러',desc:'살아는 돌아왔지만 영혼은 아직 2호선 어딘가에 남아있다.'};
}
function personal(){
  const ride=Math.max(G.rideTime,1),seatP=Math.round(G.seatTime/ride*100),holdP=Math.round(G.holdTime/ride*100);
  let line;
  if(G.stumbles>=3)line=`손잡이를 믿지 않는 자유로운 영혼. 오늘만 ${G.stumbles}번 휘청였다.`;
  else if(seatP>=60)line=`엉덩이에 자석 달림. 탑승 시간의 ${seatP}%를 앉아서 보냈다.`;
  else if(G.chats>=3)line=`지하철 인싸. 모르는 승객 ${G.chats}명과 수다를 떨었다.`;
  else if(holdP>=45)line=`손잡이 장인. 탑승 시간의 ${holdP}% 동안 꼿꼿하게 버텼다.`;
  else if(G.steals>0)line=`눈앞에서 자리를 ${G.steals}번 뺏겼다. 칼좌석러를 잊지 않겠다.`;
  else line='평범한 듯 비범한 퇴근. 내일도 이 정도면 선방.';
  const worst=[...G.encountered].sort((a,b)=>(b.ref.dmg||0)-(a.ref.dmg||0))[0];
  return{line,worst,seatP};
}
function capturePortrait(){
  // 정사각형으로 잘라낼 영역이 항상 약 34°가 되도록 세로 FOV 보정
  const asp=camera.aspect,vfov=asp<1?2*Math.atan(Math.tan(17*Math.PI/180)/asp)*180/Math.PI:34;
  const cam=new THREE.PerspectiveCamera(vfov,asp,.1,40);
  cam.position.set(player.x,.82,player.z+2.2);cam.lookAt(player.x,.55,player.z);
  labelLayer.style.display='none';const others=agents.filter(a=>a!==player);others.forEach(a=>a.c.root.visible=false);renderer.render(scene,cam);others.forEach(a=>a.c.root.visible=true);
  const src=renderer.domElement,sw=src.width,sh=src.height,side=Math.min(sw,sh),out=document.createElement('canvas');out.width=out.height=600;
  out.getContext('2d').drawImage(src,(sw-side)/2,(sh-side)/2,side,side,0,0,600,600);labelLayer.style.display='';return out;
}
let cardCanvas=null;

  if(pz.worst){x.fillStyle='#fff0f2';rr(x,90,1010,900,76,24);x.fill();x.fillStyle='#e2566c';x.font=`900 30px ${FONT}`;x.fillText(`오늘의 원수: ${pz.worst.emoji} ${pz.worst.name}  (스트레스 +${Math.round(pz.worst.ref.dmg||0)})`,118,1058);}
  let cx=90,cy=1120;x.font=`800 25px ${FONT}`;

  x.fillStyle='#5fc49a';x.font=`800 26px ${FONT}`;x.fillText('#온라인퇴근지하철 #아무거나실험실',90,1272);

}
function buildShareText(){const r=getResult();return `온라인 퇴근 지하철 결과 🚇\n${nick}: ${r.emoji} ${r.title}\n스트레스 ${Math.round(G.stress)} / 인내심 ${Math.round(G.patience)}\n오늘 만난 빌런 ${G.encountered.length}명 · 휘청 ${G.stumbles}회\n${personal().line}\n#온라인퇴근지하철 #아무거나실험실`;}
function finishGame(){
  if(G.phase==='result')return;G.phase='result';
  const portrait=capturePortrait();cardCanvas=drawCard(portrait);$('cardImg').src=cardCanvas.toDataURL('image/png');
  $('hud').classList.add('hide');closeAllUI();$('result').classList.remove('gone');
}
async function shareResult(){
  const text=buildShareText();
  try{const blob=await new Promise(r=>cardCanvas.toBlob(r,'image/png'));const file=new File([blob],'online-subway-result.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'온라인 퇴근 지하철',text});return;}
    if(navigator.share){await navigator.share({title:'온라인 퇴근 지하철',text,url:location.href.split('?')[0]});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}

// ───────────────────────── 리셋 ─────────────────────────
function resetGame(){
  [...agents].forEach(a=>{if(a!==player)a.remove();});
  G.villains.forEach(v=>{const b=VB[v.vtype];b.calm&&b.calm(v);b.cleanup&&b.cleanup(v);});
  while(fxGroup.children.length)fxGroup.remove(fxGroup.children[0]);
  seats.forEach(s=>{s.occupant=null;s.reserved=null;s.blockedBy=null;});straps.forEach(s=>{s.holder=null;s.reserved=null;});
  sched.length=0;
  Object.assign(G,{phase:'intro',stationIndex:0,stress:0,patience:100,encountered:[],stumbles:0,chats:0,rideTime:0,seatTime:0,holdTime:0,steals:0,segPlan:planSegments(),villains:[],firstSit:false,firstHold:false,focusV:null});
  Object.assign(T,{phase:'idle',t:0,v:0,s:0,accel:0,jolts:[]});
  Object.assign(player,{leaving:false,x:-3.6,z:0,yaw:0,targetYaw:0,state:'stand',seat:null,strap:null,trans:null,autoPath:null,exitPath:null,knock:null,vx:0,vz:0});
  player.c.poseT.cheer=0;player.c.poseT.lean=0;player.c.anim='idle';
  populate();DOORS.forEach(d=>{d.target=1;});setPlatformStation(0);updateDisplays();
  $('result').classList.add('gone');$('intro').classList.remove('gone');$('introTitle').classList.remove('gone');$('hud').classList.add('hide');
  $('msg').classList.add('off');buildIntro();
}

// ───────────────────────── 루프 ─────────────────────────
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);if(window.visualViewport)visualViewport.addEventListener('resize',resize);
resize();buildRoute();resetGame();
let last=performance.now()/1000;
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now()/1000;const dt=Math.min(now-last,1/20);last=now;frame(dt);
}
function frame(dt){
  clock+=dt;const t=clock;
  updateTrain(dt,t);
  if(G.phase==='play'||G.phase==='exiting')updatePlayer(dt,t);
  if(G.phase==='intro'){player.targetYaw=Math.sin(t*.7)*.5;}
  for(const a of [...agents])a.update(dt,t);
  if(G.phase==='play'||G.phase==='exiting'){updateVillains(dt,t);}
  updateStraps(t,T.accel,T.v/VMAX);
  updateCamera(dt,t);
  leds.forEach(tx=>{tx.offset.x=(tx.offset.x+dt*.07)%1;});
  renderer.render(scene,camera);
  updateLabels();
  if(G.phase==='play'){renderActs();updateHUD();}
  if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)$('msg').classList.add('off');}
  if(signTimer>0){signTimer-=dt;if(signTimer<=0)$('sign').classList.remove('show');}
  if(G.phase==='play'&&player.state!=='stand')$('warn').classList.add('gone');
}
$('loading').remove();
loop();
